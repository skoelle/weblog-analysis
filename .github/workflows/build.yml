name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only the branch run publishes :latest, so only it can roll out an
      # update. A tag push would always report updated=0 because :latest is
      # already current by then.
      - name: Notify deploy webhook (Watchtower)
        if: env.WEBHOOK_URL != '' && github.ref_type == 'branch'
        run: |
          set -euo pipefail
          auth=()
          if [ -n "${WEBHOOK_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer $WEBHOOK_TOKEN")
          fi
          http_code=$(curl -sS -o webhook-response.json -w "%{http_code}" \
            --connect-timeout 15 --max-time 600 \
            -X POST "$WEBHOOK_URL" "${auth[@]}")
          echo "webhook: HTTP $http_code"
          cat webhook-response.json; echo
          updated=$(jq -r '.summary.updated // 0' webhook-response.json 2>/dev/null || echo 0)
          failed=$(jq -r '.summary.failed // 0' webhook-response.json 2>/dev/null || echo 0)
          echo "updated=$updated failed=$failed"
          if [ "$http_code" != "200" ] || [ "$failed" -gt 0 ]; then
            echo "::error::webhook failed (HTTP $http_code, updated=$updated, failed=$failed)"
            exit 1
          fi
          if [ "$updated" -le 0 ]; then
            echo "::warning::webhook reported no update; the image may already be current"
          fi

  cleanup-old-images:
    needs: build-and-push
    # Also run when only the webhook step failed, but not on cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old container image versions (keep last 4)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 4
          delete-only-untagged-versions: false
