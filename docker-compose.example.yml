services:
  weblog-analysis:
    image: ghcr.io/skoelle/weblog-analysis:latest
    pull_policy: always
    container_name: weblog-analysis
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Holds the SQLite database and, with LOG_DIR=/app/data/logs, the logs
      # fetched by the container itself.
      - ./data:/app/data
      # "Bring your own logs": uncomment to read an existing directory instead
      # of fetching over SFTP, then set LOG_DIR=/logs in .env.
      # - ${LOG_HOST_DIR:-./data/logs}:/logs:ro
    ports:
      - "8095:8095"
    labels:
      # Lets Watchtower pick this container up (--label-enable mode) when the
      # build pushes a new image and calls the deploy webhook.
      - com.centurylinklabs.watchtower.enable=true
