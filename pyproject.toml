[project]
name = "weblog-analysis"
version = "0.2.0"
description = "Web log analysis for combined access logs: weekly visitors, bots and crawling"
requires-python = ">=3.12"
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["access log", "apache", "nginx", "fastapi", "analytics", "bots"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Log Analysis",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "paramiko>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]
